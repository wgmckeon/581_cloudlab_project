services:

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - docker-counter
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./app   
    container_name: visitor-web
    restart: on-failure 
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    networks:
      - docker-counter
    depends_on:
      redis:
        condition: service_healthy

networks:
  docker-counter:
    driver: bridge
